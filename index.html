<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>IKI1UC · UNIVERSAL BOOTSTRAP</title>

<style>
body {
    margin: 0;
    background: #000;
    color: #0ff;
    font-family: Consolas;
}
#boot {
    position: absolute;
    top: 10px;
    left: 10px;
    padding: 12px;
    border: 1px solid #0ff;
    border-radius: 8px;
    background: rgba(0,0,0,0.5);
    box-shadow: 0 0 12px #0ff;
}
#modules {
    margin-top: 10px;
    max-height: 400px;
    overflow-y: auto;
    font-size: 12px;
}
</style>

<script type="module">

/* ————————————————————————————————
   UNIVERSAL MODULE SCANNER
——————————————————————————————— */

async function scanRepository() {
    const response = await fetch("./");
    const text = await response.text();

    // HTML Directory Listing Parser
    const parser = new DOMParser();
    const doc = parser.parseFromString(text, "text/html");

    const links = [...doc.querySelectorAll("a")].map(a => a.getAttribute("href"));

    // Filter JS, JSON, HTML modules
    const modules = links.filter(f =>
        f.endsWith(".js") ||
        f.endsWith(".json") ||
        f.endsWith(".html")
    );

    return modules;
}

/* ————————————————————————————————
   UNIVERSAL MODULE LOADER
——————————————————————————————— */

async function loadModules(modules) {

    const loaded = [];

    for (const m of modules) {
        try {
            if (m.endsWith(".js")) {
                await import(`./${m}`);
                loaded.push({ file: m, type: "js", status: "OK" });
            }
            else if (m.endsWith(".json")) {
                const data = await fetch(`./${m}`).then(r => r.json());
                loaded.push({ file: m, type: "json", status: "OK", data });
            }
            else if (m.endsWith(".html")) {
                loaded.push({ file: m, type: "html", status: "OK" });
            }
        } catch (e) {
            loaded.push({ file: m, type: "error", status: "FAIL", error: e });
        }
    }

    return loaded;
}

/* ————————————————————————————————
   UNIVERSAL ENGINE STARTER
——————————————————————————————— */

function startUniverse(loaded) {

    console.log("IKI1UC · UNIVERSUM STARTET …");
    console.log("Geladene Module:", loaded);

    // GLOBAL PALAISE UNIVERSE
    window.UNIVERSE = {
        modules: loaded,
        timestamp: Date.now(),
        start: "RUN∞",
        state: {}
    };

    // Auto‑Start bekannte Engines
    const autoEngines = [
        "ALL.ultra.js",
        "ALL.pipeline12.js",
        "VECTOR.render.js",
        "VECTOR.orbit.js",
        "pipeline12.master.js",
        "respo_bridge.js",
        "ghost.js",
        "ultra.kernel.js",
        "API.system.js"
    ];

    for (const engine of autoEngines) {
        const found = loaded.find(m => m.file.endsWith(engine));
        if (found) {
            console.log("Starte Engine:", engine);
        }
    }

    // UI Update
    const out = document.getElementById("modules");
    out.innerHTML = loaded.map(m =>
        `<div>${m.status} — ${m.file}</div>`
    ).join("");
}

/* ————————————————————————————————
   BOOTSTRAP
——————————————————————————————— */

(async function bootstrap() {

    document.getElementById("status").innerText = "Scanning Repository…";

    const modules = await scanRepository();

    document.getElementById("status").innerText = "Loading Modules…";

    const loaded = await loadModules(modules);

    document.getElementById("status").innerText = "Starting Universe…";

    startUniverse(loaded);

    document.getElementById("status").innerText = "IKI1UC · UNIVERSUM AKTIV";
})();
</script>

</head>
<body>

<div id="boot">
    <b>IKI1UC · UNIVERSAL BOOTSTRAP</b><br>
    <span id="status">Init…</span>
    <div id="modules"></div>
</div>

</body>
</html>
